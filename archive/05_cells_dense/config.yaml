description: 'Ground-truth dataset, main variant. 2000 spherical cells (radius 5-9
    um, so 10-18 um across) with lognormal brightness in a 256 x 256 x 256 um volume,
    imaged at NA 0.5 and delivered on a 1 x 1 x 4 um voxel grid with shot and read
    noise. Cells refract (dn = 0.02) so the PSF degrades with depth; the medium is
    index-matched.

    '
seed: 42
config_file: config/cells_dense.yaml
volume:
    nx: 512
    ny: 512
    nz: 256
    dx: 0.5
    dz: 1.0
phantom:
    type: cells
    n_cells: 2000
    radius_um:
    - 5.0
    - 9.0
    min_gap_um: 0.5
    edge_um: 0.4
    dn_cell: 0.02
    brightness:
        dist: lognormal
        sigma: 0.6
        low: 0.3
        high: 3.0
        clip:
        - 0.08
        - 4.0
    hollow: false
    shell_um: 1.5
    margin_um: 1.0
    spheroid_radius_um: 60.0
    spheroid_center_um: null
    bead_grid:
    - 5
    - 5
    - 9
    bead_radius_um: 0.15
    bead_brightness: 1.0
medium:
    type: none
    dn_rms: 0.004
    correlation_um: 25.0
    correlation_z_um: 40.0
    slab_dn: 0.02
    slab_thickness_um: 20.0
    slab_tilt: 0.02
optics:
    nm: 1.33
    na: 0.5
    lbda: 0.532
    directions:
    -   - 0.0
        - 0.0
        - 1.0
    zernike:
        defocus: 0.0
        astig_0: 0.0
        astig_45: 0.0
        coma_x: 0.0
        coma_y: 0.0
        spherical: 0.0
emission:
    n_iterations: 200
    stochastic: false
    sparsity: 0.01
camera:
    bin_xy: 2
    bin_z: 4
    photons_peak: 300.0
    background_photons: 5.0
    poisson: true
    read_noise_e: 2.0
    offset: 100.0
    gain: 1.0
    bit_depth: 16
engine:
    device: cuda:1
    deterministic: false
    log_dir: ./log
    save_fine_volume: false
    save_gt_volume: true
    save_label_volume: true
    save_gif: true
    gif_gamma: 0.6
    gif_duration_ms: 80
    gif_max_frames: 120
    psf_report: false
